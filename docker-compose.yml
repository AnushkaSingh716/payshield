services:
  # PostgreSQL database
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-payshield}
    ports:
      - "5432:5432"            # lets scripts on your computer (like retrain.py) reach it
    volumes:
      - pgdata:/var/lib/postgresql/data   # keeps your data when containers restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FastAPI backend (with both models inside)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # "db" is the database container's name on the Docker network
      DATABASE_URL: postgresql://${POSTGRES_USER:-payshield}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-payshield}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   # wait until the database is ready

  # React dashboard served by nginx
  frontend:
    build:
      context: ./frontend
      args:
        # Your browser (not Docker) calls the API, so this is localhost
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata: